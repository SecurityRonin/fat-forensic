name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # fmt · clippy · test (3 OS) · MSRV · cargo-deny · cargo-vet · secret scan ·
  # fuzz build-check · rustdoc · 100% per-line coverage · path-dep gate.
  #
  # The old `coverage` job already enforced 100% per-line at
  # `--workspace --all-features`, exempting `// cov:unreachable` lines and
  # delimiter-only artifacts — which is exactly the shared workflow's default
  # gate, so `coverage-gate` is left alone. All 11 existing markers already
  # carry a reason, so the default `require-exemption-reason: true` holds.
  # MSRV is read from rust-version (1.85), replacing the hand-pinned `msrv` job.
  ci:
    uses: SecurityRonin/fleet-ci/.github/workflows/rust-ci.yml@85c7263e5e1a25a090f602419ac27f87aeb1d1e3
    with:
      # Carried across: the old coverage run was
      # `--workspace --exclude fat-forensic-cli`, deliberately keeping the thin
      # CLI shell out of the 100% gate (Humble Object — decisions live in the
      # library, not the glue). The shared workflow has no `--exclude` input, so
      # the same members are dropped from the report by path instead.
      # NOTE: metacharacter-free on purpose. This value is interpolated
      # UNQUOTED into the coverage job's shell, so a regex containing `(`, `|`
      # or `)` would abort the job with a bash syntax error rather than change
      # the gate. llvm-cov matches it as an unanchored substring regex, so the
      # plain path prefix is sufficient.
      coverage-ignore-regex: cli/src/
